name: Verify + grow (podcasts, audiobooks, devotional, zeno)

# Re-checks every feed/item URL in this repo (EXCLUDING radio — that has its
# own daily, sharded, ffprobe-audio-verified workflow now, see
# verify-radio-daily.yml) and removes whatever is no longer reachable — so
# the catalog stays a list of items confirmed live as of the last run
# instead of slowly rotting. Then runs each category's growth script
# (grow_podcasts.py / grow_audiobooks.py / grow_devotional.py) so the
# catalog keeps growing too, not just shrinking — same verify-then-grow
# pattern, and now the same daily cadence, as verify-radio-daily.yml uses
# for radio. Runs on its own — no local machine needed.
on:
  schedule:
    # Daily (03:00 UTC — offset an hour after radio's midnight-UTC run so
    # the two workflows don't both hit archive.org/iTunes at once).
    - cron: '0 3 * * *'
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

# Without this, a manual workflow_dispatch run overlapping the scheduled
# run (this job takes 15-20 min) races both pushes to main — whichever
# pushes second gets "rejected: fetch first" with no retry, silently
# discarding that run's verify/grow work. Matches verify-radio-daily.yml's
# same guard.
concurrency:
  group: verify-stations
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install aiohttp

      - name: Run verification (remove dead items — podcasts, audiobooks, devotional, zeno)
        # Exits 1 when its per-category safety valve aborts one category
        # (e.g. archive.org itself being down mid-run, unrelated to the
        # other categories) — that's a deliberate "don't trust THIS
        # category's numbers" signal, not a reason to discard everything
        # else this run already correctly computed and wrote to disk. The
        # steps below all use `if: success() || failure()` so a partial
        # abort here doesn't throw away good work in podcasts/audiobooks/etc.
        # Radio is deliberately excluded — see verify-radio-daily.yml. Zeno
        # is its own standalone collection (not part of radio/) — see
        # grow_zeno.py's docstring for why it's kept separate.
        run: python3 verify_stations.py --only podcasts,audiobooks,devotional,zeno --concurrency 300 --timeout 8 --retries 2

      # max-new is deliberately much lower here than a one-off manual run —
      # this now fires every day (see cron above), and radio's own 500/day
      # is a small fraction of its ~40k-station catalog. 300/300/200 at
      # this frequency would both bloat these much smaller catalogs with
      # rapidly-diminishing-quality candidates and repeatedly hammer
      # archive.org/iTunes with the exact kind of request burst that got
      # this project's own IP temporarily rate-limited earlier today. These
      # values keep daily growth meaningful without either problem.
      - name: Grow podcasts (add new verified podcasts)
        if: success() || failure()
        run: python3 grow_podcasts.py --max-new 50 --concurrency 15 --timeout 12

      - name: Grow audiobooks (add new verified audiobooks)
        # Low hit rate is expected/normal here (archive.org content quality,
        # not a script problem) — see grow_audiobooks.py's own docstring.
        if: success() || failure()
        run: python3 grow_audiobooks.py --max-new 50 --fetch-rows 800 --concurrency 15 --timeout 12

      - name: Grow devotional (add new verified devotional items)
        if: success() || failure()
        run: python3 grow_devotional.py --max-new 30 --fetch-rows 800 --concurrency 15 --timeout 12

      - name: Grow zeno (add new verified Zeno.fm stations)
        if: success() || failure()
        run: python3 grow_zeno.py --max-new 50 --fetch 8000 --concurrency 20 --timeout 10

      - name: Commit + push if anything changed
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes — everything still verified live, nothing new to add."
            exit 0
          fi
          git add -A
          git commit -m "Auto-update (daily): remove dead items, add newly verified ones

          Scheduled run of verify_stations.py + grow_podcasts.py/
          grow_audiobooks.py/grow_devotional.py/grow_zeno.py — see workflow
          run logs for before/after counts. Radio is handled separately
          (daily/sharded), see verify-radio-daily.yml."
          git push

      - name: Purge jsDelivr CDN cache
        # The app fetches content via cdn.jsdelivr.net (not raw.githubusercontent.com)
        # for CDN-grade reliability at scale, but jsDelivr caches @main content
        # for up to ~24h. Without this, a change just pushed above wouldn't
        # reach users until that cache naturally expired.
        if: success() || failure()
        run: |
          for f in $(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo ""); do
            curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f" -o /dev/null || true
          done
