name: Verify radio (daily, deep audio check)

# Radio-only. Two things this does that the weekly job (verify-stations.yml)
# doesn't:
#   1. Deep check: HTTP reachability AND real decodable audio via ffprobe —
#      catches stations whose web server is healthy (200, plausible
#      Content-Type) but whose actual encoder feed is dead, which a plain
#      HTTP check can't tell apart from the real thing.
#   2. Sharded: only checks ~1/15th of the radio catalog per day (stable,
#      id-hash based — see shard_of() in verify_stations.py), so the full
#      ~33k-station catalog gets fully re-verified once every 15 days
#      without one huge daily burst, and a run that's delayed or skipped by
#      GitHub just self-heals on the next date-based shard — no cursor file.
# Then runs grow_stations.py so the catalog keeps growing daily too, not
# just shrinking — this is additive to the weekly job, not a replacement.
on:
  schedule:
    - cron: '0 0 * * *' # daily, midnight UTC
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

concurrency:
  group: verify-radio
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-radio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install aiohttp
          # ubuntu-latest ships ffmpeg/ffprobe already, but install
          # explicitly so this doesn't silently break if that ever changes.
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffprobe -version | head -1

      - name: Verify today's radio shard (HTTP + ffprobe audio check)
        # Lower concurrency than the weekly job's 300 — each check here
        # spawns a real ffprobe process (heavier than a plain HTTP request),
        # so this trades some throughput for not overloading the runner.
        run: python3 verify_stations.py --only radio --ffprobe --shard-cycle-days 15 --concurrency 25 --timeout 8 --retries 2

      - name: Run growth (add new verified radio stations)
        # Keeps adding, not just removing — capped at 500/run to keep
        # runtime bounded within the same job.
        if: success() || failure()
        run: python3 grow_stations.py --max-new 500 --concurrency 150 --timeout 8

      - name: Commit + push if anything changed
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes — today's radio shard still verified live, nothing new to add."
            exit 0
          fi
          git add -A
          git commit -m "Auto-update (radio, daily): remove dead stations in today's shard, add newly verified ones

          Scheduled run of verify_stations.py --ffprobe --shard-cycle-days 15
          + grow_stations.py — see workflow run logs for before/after counts
          and which shard was checked today."
          git push

      - name: Purge jsDelivr CDN cache
        # The app fetches content via cdn.jsdelivr.net (not raw.githubusercontent.com)
        # for CDN-grade reliability at scale, but jsDelivr caches @main content
        # for up to ~24h. Without this, a change just pushed above wouldn't
        # reach users until that cache naturally expired.
        if: success() || failure()
        run: |
          for f in $(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo ""); do
            curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f" -o /dev/null || true
          done
